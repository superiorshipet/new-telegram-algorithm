[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-leads-system"
version = "0.1.0"
description = "Telegram group lead collection and notification workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "cryptography>=43,<46",
    "pydantic-settings>=2.5,<3",
    "python-json-logger>=2.0,<4",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "telethon>=1.36,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
